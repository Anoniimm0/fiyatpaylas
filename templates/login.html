<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiyatPaylaş</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <div class="login-card">

        <h1>FiyatPaylaş</h1>
        <p>Fiyat Paylaşım Otomasyon Sistemi</p>

<form action="/" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Kullanıcı Adı"
                required>

            <input
                type="password"
                name="password"
                placeholder="Şifre"
                required>

            <button type="submit">
                Giriş Yap
            </button>

        </form>

    </div>

</div>

</body>
</html>
